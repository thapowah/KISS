services:
  kiss:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8088}:8000"
    volumes:
      - kiss_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  kiss_data:
